<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2845"/>
      <stop offset="50%" stop-color="#223354"/>
      <stop offset="100%" stop-color="#334B73"/>
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A6D99" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#223354" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2D6EC" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4A6D99" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FADADD"/>
      <stop offset="100%" stop-color="#C2D6EC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ethereal Mountain Glow Aura -->
  <circle cx="950" cy="180" r="220" fill="#FADADD" opacity="0.12" filter="url(#glow)"/>
  <circle cx="300" cy="450" r="280" fill="#C2D6EC" opacity="0.15" filter="url(#glow)"/>

  <!-- Background Mountain Silhouette -->
  <polygon points="150,630 450,280 750,630" fill="url(#mountain1)"/>
  <polygon points="500,630 820,210 1150,630" fill="url(#mountain1)"/>
  <polygon points="700,630 980,310 1250,630" fill="url(#mountain2)"/>
  <polygon points="-50,630 220,340 520,630" fill="url(#mountain2)"/>

  <!-- Grid overlay for tech aesthetic -->
  <path d="M0,150 L1200,150 M0,300 L1200,300 M0,450 L1200,450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M200,0 L200,630 M400,0 L400,630 M600,0 L600,630 M800,0 L800,630 M1000,0 L1000,630" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Brand Badge -->
  <g transform="translate(100, 110)">
    <rect width="210" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#C2D6EC" stroke-opacity="0.3"/>
    <circle cx="24" cy="19" r="5" fill="#FADADD"/>
    <text x="38" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" fill="#FADADD" letter-spacing="1">AI CREATOR PLATFORM</text>
  </g>

  <!-- Logo & Title -->
  <g transform="translate(100, 220)">
    <!-- Mountain Icon -->
    <rect width="56" height="56" rx="16" fill="url(#accent)"/>
    <path d="M28,14 L42,38 L14,38 Z" fill="#223354"/>
    <path d="M34,26 L46,42 L22,42 Z" fill="#4A6D99" opacity="0.7"/>

    <text x="76" y="42" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="bold" fill="#ffffff" letter-spacing="-0.5">TrendlyInside</text>
  </g>

  <!-- Tagline -->
  <text x="100" y="340" font-family="'Playfair Display', Georgia, serif" font-size="56" font-weight="bold" fill="#ffffff">
    Understand Why Content Performs.
  </text>

  <!-- Subtitle -->
  <text x="100" y="410" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#C2D6EC" opacity="0.9">
    AI-powered YouTube, Shorts &amp; Channel intelligence for creators who want to grow.
  </text>

  <!-- Value Badges Footer -->
  <g transform="translate(100, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="160" height="42" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="80" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✓ 100% Free</text>

    <!-- Badge 2 -->
    <rect x="180" y="0" width="170" height="42" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="265" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✓ No Signup</text>

    <!-- Badge 3 -->
    <rect x="370" y="0" width="200" height="42" rx="12" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="470" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle">✓ Instant AI Coaching</text>
  </g>

  <!-- URL Watermark -->
  <text x="1100" y="580" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#94A9D0" opacity="0.6" text-anchor="end">
    trendlyinside.com
  </text>
</svg>
